<template>
    <div class="shell">
        <!-- Left navigation -->
        <nav class="nav" aria-label="Client sections">
            <ul class="nav-list">
                <template for:each={navItems} for:item="item">
                    <li key={item.key}>
                        <button
                            type="button"
                            class={item.className}
                            data-key={item.key}
                            aria-current={item.ariaCurrent}
                            aria-label={item.ariaLabel}
                            onclick={handleNavClick}
                        >
                            <span>{item.label}</span>
                            <template lwc:if={item.external}>
                                <lightning-icon
                                    class="nav-external"
                                    icon-name="utility:new_window"
                                    size="x-small"
                                ></lightning-icon>
                            </template>
                        </button>
                    </li>
                </template>
            </ul>
        </nav>

        <!-- Content -->
        <section class="content" aria-label={activeSectionLabel}>
            <template lwc:if={showTable}>
                <template lwc:if={isLoading}>
                    <div class="dir-state">
                        <lightning-spinner alternative-text="Loading clients" size="small"></lightning-spinner>
                    </div>
                </template>
                <template lwc:elseif={hasError}>
                    <div class="dir-error" role="alert">{errorMessage}</div>
                </template>
                <template lwc:else>
                    <div class="dir-scroll">
                        <table class="dir-table">
                            <thead>
                                <tr>
                                    <template for:each={columns} for:item="col">
                                        <th key={col.key} scope="col" class={col.thClass} aria-sort={col.ariaSort}>
                                            <template lwc:if={col.sortable}>
                                                <button
                                                    type="button"
                                                    class="dir-sort"
                                                    data-field={col.key}
                                                    onclick={handleSortClick}
                                                >
                                                    <span>{col.label}</span>
                                                    <template lwc:if={col.sortIcon}>
                                                        <lightning-icon
                                                            icon-name={col.sortIcon}
                                                            size="xx-small"
                                                        ></lightning-icon>
                                                    </template>
                                                </button>
                                            </template>
                                            <template lwc:else>{col.label}</template>
                                        </th>
                                    </template>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={rows} for:item="emp">
                                    <tr key={emp.id}>
                                        <td class="dir-name">{emp.displayName}</td>
                                        <td class="dir-code">{emp.externalRef}</td>
                                        <td>{emp.dobLabel}</td>
                                        <td>{emp.adviserName}</td>
                                        <td class="dir-action">
                                            <button
                                                type="button"
                                                class="dir-btn"
                                                data-id={emp.id}
                                                aria-label={emp.createLabel}
                                                onclick={handleCreateIllustration}
                                            >
                                                <span class="dir-circle" aria-hidden="true">
                                                    <lightning-icon
                                                        icon-name="utility:chevronright"
                                                        size="xx-small"
                                                        variant="inverse"
                                                    ></lightning-icon>
                                                </span>
                                                <span>Create Illustration</span>
                                            </button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <p class="dir-count">{countLabel}</p>
                </template>
            </template>
            <template lwc:else>
                <div class="placeholder">
                    <h2 class="placeholder-title">{activeSectionLabel}</h2>
                    <p>This section isn't available yet.</p>
                </div>
            </template>
        </section>
    </div>

    <template lwc:if={dialogEmployee}>
        <c-illustration-dialog
            employee={dialogEmployee}
            employees={employees}
            onstart={handleStartIllustration}
            oncancel={handleDialogCancel}
        ></c-illustration-dialog>
    </template>
</template>
